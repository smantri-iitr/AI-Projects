<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Top N News</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-inner">
        <h1><span aria-hidden="true">📰</span> Top <em id="headline-n">10</em> News</h1>
        <p class="tagline">The biggest stories per topic from the last <em id="headline-days">7</em> days.</p>
      </div>
    </header>

    <main>
      <form id="controls" class="controls" autocomplete="off">
        <div class="search-row">
          <label class="field search-field">
            <span class="field-label">Search a topic</span>
            <input
              type="search"
              id="query"
              name="q"
              placeholder="e.g. semiconductor exports, ISRO, interest rates…"
            />
          </label>

          <label class="field narrow">
            <span class="field-label">Top N</span>
            <input type="number" id="count" name="n" min="1" max="100" value="10" />
          </label>

          <label class="field narrow">
            <span class="field-label">Last T days</span>
            <input type="number" id="days" name="days" min="1" max="90" value="7" />
          </label>

          <label class="field narrow">
            <span class="field-label">Edition</span>
            <select id="edition" name="edition">
              <option value="auto">Auto</option>
            </select>
          </label>

          <button type="submit" id="submit" class="primary">Get news</button>
        </div>

        <div class="topics-row">
          <div class="topics-head">
            <span class="field-label">Topics</span>
            <div class="topic-actions">
              <button type="button" data-select="all" class="link-button">Select all</button>
              <button type="button" data-select="none" class="link-button">Clear</button>
            </div>
          </div>
          <div id="topics" class="chips" role="group" aria-label="Topics"></div>
        </div>
      </form>

      <section id="status" class="status" aria-live="polite"></section>
      <ol id="results" class="results"></ol>
    </main>

    <footer class="site-footer">
      Headlines via Google News RSS · ranked by relevance, recency, breadth of coverage and source.
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
